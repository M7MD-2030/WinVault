name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # GitHub's Windows runners are elevated, so this exercises every live
  # collector end-to-end: baseline -> harmless test changes -> compare.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Enable auditing
        run: .\scripts\Enable-WinVaultAuditing.ps1
      - name: Baseline
        run: winvault --store "$env:RUNNER_TEMP\wv" baseline --label ci
      - name: Make test changes
        run: .\scripts\Test-WinVaultChanges.ps1
      - name: Compare
        run: winvault --store "$env:RUNNER_TEMP\wv" compare --json "$env:RUNNER_TEMP\report.json" --show 30 --timeline
      - name: Assert detections
        shell: python
        run: |
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "report.json")))
          keys = {(c["category"], c["status"]): [] for c in r["changes"]}
          for c in r["changes"]:
              keys[(c["category"], c["status"])].append(c["key"])
          def hit(cat, status, needle):
              assert any(needle.lower() in k.lower() for k in keys.get((cat, status), [])), (cat, status, needle)
          hit("registry", "added", "WinVaultTest")
          hit("services", "added", "WinVaultTestSvc")
          hit("tasks", "added", "WinVaultTest")
          hit("startup", "added", "WinVaultTest.txt")
          assert any(c["category"] == "users" and c["status"] == "added" and c["after"]["name"] == "wv_testuser"
                     and c["after"]["is_admin"] for c in r["changes"])
          print("all 5 collectors detected their test change")

          # Phase 2: the new admin user must score critical, and every test
          # artifact must be scored as signal, never filtered as noise.
          admin = next(c for c in r["changes"] if c["category"] == "users"
                       and (c.get("after") or {}).get("name") == "wv_testuser")
          assert admin["analysis"]["level"] == "critical", admin["analysis"]
          for c in r["changes"]:
              if "WinVaultTest" in c["key"] or (c.get("after") or {}).get("name") == "wv_testuser":
                  assert c["analysis"]["noise"] is None, ("test artifact wrongly filtered", c["key"])
          print("scoring flags the new admin user critical and keeps all test artifacts as signal")

          # Phase 3: each change is tied to the audit event that names it.
          def ev_ids(change):
              return {e["event_id"] for e in change["correlation"]["evidence"]}
          svc = next(c for c in r["changes"] if c["key"] == "WinVaultTestSvc")
          assert 7045 in ev_ids(svc), svc["correlation"]
          assert svc["correlation"]["attribution"]["confidence"] in ("high", "medium")
          assert 4720 in ev_ids(admin), admin["correlation"]
          group = next(c for c in r["changes"] if c["key"] == "group:S-1-5-32-544")
          assert 4732 in ev_ids(group), group["correlation"]
          task = next(c for c in r["changes"] if c["key"] == "\\WinVaultTest")
          assert ev_ids(task) & {4698, 106}, task["correlation"]
          assert not r["alerts"], r["alerts"]
          print("service, user, group and task are each tied to their audit event")
      - name: Cleanup
        if: always()
        run: .\scripts\Test-WinVaultChanges.ps1 -Cleanup
